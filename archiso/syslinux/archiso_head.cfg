SERIAL 0 115200
UI vesamenu.c32
MENU TITLE SynapseOS
MENU BACKGROUND splash.png

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 10
MENU VSHIFT 8
MENU TABMSGROW 20
MENU CMDLINEROW 20
MENU HELPMSGROW 22
MENU HELPMSGENDROW 29

# Hex colours are #AARRGGBB and only apply when vesamenu has a 640x480
# 8-bit splash. The first column is the VGA text fallback used when a
# laptop firmware cannot start VESA graphics.
# Refer to https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32

MENU COLOR border       30;40   #00000000 #00000000 none
MENU COLOR title        1;37;40 #fff4f0fc #00000000 std
MENU COLOR sel          7;37;45 #ffffffff #ff8b6cff all
MENU COLOR unsel        37;40   #fff4f0fc #00000000 std
MENU COLOR help         36;40   #ffa89bc4 #00000000 std
MENU COLOR timeout_msg  37;40   #ffa89bc4 #00000000 std
MENU COLOR timeout      1;37;40 #ffc4b2ff #00000000 std
MENU COLOR msg07        37;40   #fff4f0fc #00000000 std
MENU COLOR tabmsg       36;40   #ffa89bc4 #00000000 std
MENU COLOR cmdline      37;40   #fff4f0fc #00000000 std

MENU CLEAR
MENU IMMEDIATE