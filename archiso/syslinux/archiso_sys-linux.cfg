LABEL arch
TEXT HELP
Boot the SynapseOS live medium on BIOS.
It allows you to install SynapseOS or perform system maintenance.
Kernel and systemd messages are shown while booting.
ENDTEXT
MENU LABEL SynapseOS live medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Debug boot option: stay on the console, do not start COSMIC
LABEL archnodesktop
TEXT HELP
Boot the SynapseOS live medium on BIOS without starting the COSMIC desktop.
Use this when the desktop fails to appear; run synapseos-logs to collect
diagnostics, or start-cosmic to try the session by hand.
ENDTEXT
MENU LABEL SynapseOS live medium (%ARCH%, BIOS) - ^console only, no desktop
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nodesktop

# Silent boot option
LABEL archquiet
TEXT HELP
Boot the SynapseOS live medium on BIOS with a silent splash-style boot.
ENDTEXT
MENU LABEL SynapseOS live medium (%ARCH%, BIOS) - ^quiet boot
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the SynapseOS live medium on BIOS with speakup screen reader.
It allows you to install SynapseOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL SynapseOS live medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
