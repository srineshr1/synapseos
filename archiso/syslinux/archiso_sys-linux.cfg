LABEL arch
TEXT HELP
Boot the SynapseOS live medium on BIOS.
It allows you to install SynapseOS or perform system maintenance.
Kernel and systemd messages are shown while booting.
ENDTEXT
MENU LABEL SynapseOS Live
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Safe graphics: force KWin QPainter composition on any hardware
LABEL archsafegfx
TEXT HELP
Boot the SynapseOS live medium on BIOS with KWin software composition
(KWIN_COMPOSE=Q). Use this if the desktop fails to start in a VM.
ENDTEXT
MENU LABEL SynapseOS Live - safe ^graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% safegfx

# Debug boot option: stay on the console, do not start Plasma
LABEL archnodesktop
TEXT HELP
Boot the SynapseOS live medium on BIOS without starting Plasma.
Use this when the desktop fails to appear; run synapseos-logs to collect
diagnostics, or synapseos-plasma to try the session by hand.
ENDTEXT
MENU LABEL SynapseOS Live - ^console only
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nodesktop

# Silent boot option
LABEL archquiet
TEXT HELP
Boot the SynapseOS live medium on BIOS with a silent splash-style boot.
ENDTEXT
MENU LABEL SynapseOS Live - ^quiet
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet loglevel=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the SynapseOS live medium on BIOS with speakup screen reader.
It allows you to install SynapseOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL SynapseOS Live - ^screen reader
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
