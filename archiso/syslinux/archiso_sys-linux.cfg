LABEL arch
TEXT HELP
Boot the SynapseOS live medium on BIOS.
It allows you to install SynapseOS or perform system maintenance.
ENDTEXT
MENU LABEL SynapseOS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0

# Safe graphics: force KWin QPainter composition on any hardware
LABEL archsafegfx
TEXT HELP
Boot the SynapseOS live medium on BIOS with KWin software composition
(KWIN_COMPOSE=Q). Use this if the desktop fails to start in a VM.
ENDTEXT
MENU LABEL SynapseOS - safe ^graphics
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq safegfx

# Debug boot option: stay on the console, do not start Plasma
LABEL archnodesktop
TEXT HELP
Boot the SynapseOS live medium on BIOS without starting Plasma.
Use this when the desktop fails to appear; run synapseos-logs to collect
diagnostics, or synapseos-plasma to try the session by hand.
ENDTEXT
MENU LABEL SynapseOS - ^console only
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq nodesktop

# Verbose boot option
LABEL archverbose
TEXT HELP
Boot the SynapseOS live medium on BIOS with kernel and systemd messages.
ENDTEXT
MENU LABEL SynapseOS - ^verbose
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the SynapseOS live medium on BIOS with speakup screen reader.
It allows you to install SynapseOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL SynapseOS - ^screen reader
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq accessibility=on

# Optional: copy the squashfs into RAM so the USB can be removed.
# Needs ~16G. Default boot does not do this.
LABEL archcopytoram
TEXT HELP
Copy the live image into RAM (needs about 16G). You can then remove the USB.
ENDTEXT
MENU LABEL SynapseOS - copy to ^RAM (16G+)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0
