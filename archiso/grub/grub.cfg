# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Graphics menu when the firmware allows it. Hex colours and the theme only
# work on gfxterm; named white/black colours still apply if we have to stay
# on the console, which is why some laptops used to show a colourless menu.
set color_normal=white/black
set color_highlight=white/blue
set menu_color_normal=white/black
set menu_color_highlight=white/blue
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    insmod gfxterm
    insmod png
    insmod gfxmenu
    set gfxmode="1920x1080x32,1920x1080,1366x768,1280x720,1024x768x32,1024x768,800x600,auto"
    terminal_input console
    if terminal_output gfxterm ; then
        if [ -f /boot/grub/theme/theme.txt ]; then
            set theme=/boot/grub/theme/theme.txt
            export theme
        fi
    else
        terminal_output console
    fi
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=archlinux
timeout=5
timeout_style=menu


# Menu entries

# Live root stays on the USB. copytoram=auto would pull a ~4G squashfs into
# RAM and OOM an 8G machine as soon as Plasma plus a browser start.
# cow_spacesize caps the writable overlay so /home and /tmp writes cannot
# grow without bound. Use Advanced → Copy to RAM only on 16G+ machines.
#
# systemd.gpt_auto=no: do not probe internal GPT disks at PID 1 start.
# The installer still sees every disk. libata.force=noncq: ThinkPad-class
# SATA HDDs otherwise FPDMA-timeout and freeze systemd before Calamares.
menuentry "SynapseOS" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

submenu "Advanced options" --id 'advanced' {
    menuentry "Safe graphics" --hotkey g --class arch --class gnu-linux --class gnu --class os --id 'archlinux-safegfx' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq safegfx
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    menuentry "Console only" --hotkey c --class arch --class gnu-linux --class gnu --class os --id 'archlinux-nodesktop' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq nodesktop
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    menuentry "Verbose" --hotkey v --class arch --class gnu-linux --class gnu --class os --id 'archlinux-verbose' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    menuentry "Screen reader" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq accessibility=on
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }

    menuentry "Copy to RAM (16G+)" --hotkey r --class arch --class gnu-linux --class gnu --class os --id 'archlinux-copytoram' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y cow_spacesize=1G systemd.gpt_auto=no libata.force=noncq quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    }
}


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memory test (Memtest86+)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Memory test (Memtest86+)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == 'i386' -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    elif [ "${grub_cpu}" == 'arm64' -a -f '/shellaa64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellaa64.efi
        }
    elif [ "${grub_cpu}" == 'riscv64' -a -f '/shellriscv64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellriscv64.efi
        }
    elif [ "${grub_cpu}" == 'loongarch64' -a -f '/shellloongarch64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellloongarch64.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Shut down' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'Restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
