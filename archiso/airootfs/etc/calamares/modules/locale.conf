---
# Starting point for the timezone map; the user picks their own.
region: "America"
zone: "New_York"

# Available locales are read from /usr/share/i18n/SUPPORTED and /etc/locale.gen
# in the target system, so nothing has to be listed here.
localeGenPath: "/etc/locale.gen"

# Offline install: the geoip section is deliberately absent, which disables the
# lookup entirely (a "none" style is not a recognised value).
