---
units:
  # Boot into a graphical session (creates default.target -> graphical.target).
  - name: "graphical.target"
    action: "enable"
    mandatory: true

  # Caelestia has no bundled greeter; tuigreet on tty1. Live media still
  # autologins via getty@tty1 + .zprofile; postinstall removes that.
  - name: "greetd.service"
    action: "enable"
    mandatory: true

  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true

  - name: "bluetooth.service"
    action: "enable"
    mandatory: false

  # Socket activation, so `sudo docker ...` works without the daemon running
  # all the time. Note: adding a user to the `docker` group is equivalent to
  # giving them passwordless root, so that is left to the user.
  - name: "docker.socket"
    action: "enable"
    mandatory: false

  # Live-media only services.
  - name: "pacman-init.service"
    action: "disable"
  - name: "choose-mirror.service"
    action: "disable"
  - name: "livecd-alsa-unmuter.service"
    action: "disable"
  - name: "livecd-talk.service"
    action: "disable"
