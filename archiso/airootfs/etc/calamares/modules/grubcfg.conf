---
# Edit the /etc/default/grub that came from the live filesystem rather than
# replacing it, but force our defaults so live-media values cannot leak in.
overwrite: false
prefer_grub_d: false
keep_distributor: false
always_use_defaults: true

kernel_params: [ "quiet", "loglevel=3" ]

defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "saved"
  GRUB_DISABLE_SUBMENU: false
  GRUB_TERMINAL_OUTPUT: "console"
  GRUB_DISABLE_RECOVERY: true
  GRUB_DISABLE_OS_PROBER: false
