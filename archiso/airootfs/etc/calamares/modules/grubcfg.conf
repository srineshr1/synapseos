---
# Edit the /etc/default/grub that came from the live filesystem rather than
# replacing it, but force our defaults so live-media values cannot leak in.
overwrite: false
prefer_grub_d: false
keep_distributor: false
always_use_defaults: true

kernel_params: [ "quiet", "loglevel=3" ]

defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "saved"
  GRUB_DISABLE_SUBMENU: false
  GRUB_TERMINAL_OUTPUT: "gfxterm"
  GRUB_GFXMODE: "1920x1080x32,1920x1080,1366x768,1280x720,1024x768x32,1024x768,800x600,auto"
  GRUB_THEME: "/usr/share/grub/themes/synapseos/theme.txt"
  GRUB_COLOR_NORMAL: "white/black"
  GRUB_COLOR_HIGHLIGHT: "white/blue"
  GRUB_DISABLE_RECOVERY: true
  GRUB_DISABLE_OS_PROBER: false
