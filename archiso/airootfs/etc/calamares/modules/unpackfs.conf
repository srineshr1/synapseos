---
# Source path is published by /usr/share/synapseos/locate-rootfs.sh
# (stable symlink). Do not hard-code bootmnt: on real USB installs with
# enough RAM, archiso copytoram=auto moves the image to
# /run/archiso/copytoram/ and unmounts /run/archiso/bootmnt.
unpack:
    - source: /run/synapseos/airootfs.sfs
      sourcefs: squashfs
      destination: ""
      weight: 1
