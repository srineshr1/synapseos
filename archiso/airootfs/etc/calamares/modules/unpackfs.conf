---
# Source path is published by /usr/share/synapseos/locate-rootfs.sh
# (stable symlink). Do not hard-code bootmnt: Advanced → Copy to RAM
# still moves the image to /run/archiso/copytoram/ and unmounts bootmnt.
unpack:
    - source: /run/synapseos/airootfs.sfs
      sourcefs: squashfs
      destination: ""
      weight: 1
