---
# URLs come from branding.desc; here we only decide which buttons are shown.
showSupportUrl: true
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

# The live image is fully self-contained, so internet is never required and
# internetCheckUrl is deliberately unset.
#
# requiredStorage is in GiB and must stay ahead of the unpacked rootfs, which is
# ~16 GB now that the toolchains, editors and browsers are preinstalled.
requirements:
  requiredStorage: 25
  requiredRam: 2.0
  check:
    - storage
    - ram
    - power
    - root
    - screen
  required:
    - storage
    - ram
    - root
