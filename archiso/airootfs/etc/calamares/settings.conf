---
modules-search:
  - /usr/lib/calamares/modules
  - /usr/share/calamares/modules

# Only modules used more than once (or under a different config name) need an
# explicit instance; everything else loads <module>.conf by default.
instances:
  - id:       prepare
    module:   shellprocess
    config:   shellprocess-prepare.conf
  - id:       postinstall
    module:   shellprocess
    config:   shellprocess-postinstall.conf
  - id:       plymouth
    module:   shellprocess
    config:   shellprocess-plymouth.conf

sequence:
  - show:
      - welcome
      - locale        # language + timezone (there is no separate timezone module)
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition     # must run here, or nothing is partitioned or formatted
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@prepare
      - luksbootkeyfile
      - luksopenswaphookcfg
      - initcpiocfg
      - shellprocess@plymouth
      - initcpio
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - shellprocess@postinstall
      - umount        # last: unmounts the target so the install is consistent
  - show:
      - finished

branding: synapseos

# Required settings
dont-chroot: false
oem-setup: false
prompt-install: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
